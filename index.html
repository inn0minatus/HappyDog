<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile-first, fixed-scale game canvas: disable user zoom/scroll so taps
         only ever mean "jump". `viewport-fit=cover` handles notched phones. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1418" />
    <meta name="description" content="Happy Dog Runner — dodge the ticks, grab the tablets!" />
    <title>Happy Dog Runner</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0f1418;
      }
      /* Full-viewport mount; Phaser's Scale.FIT letterboxes the 1280×720 canvas. */
      #game {
        width: 100vw;
        height: 100vh;
      }
      /* Taps mean "jump" — never scroll/zoom the page. */
      #game,
      #game canvas {
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>

    <!--
      ────────────────────────────────────────────────────────────────────────
      ANALYTICS SNIPPET PLACEHOLDERS (GA4 + Meta Pixel)
      ────────────────────────────────────────────────────────────────────────
      These are intentionally left as COMMENTED placeholders — this is the ONLY
      analytics path (no active snippet here, so nothing double-loads). We do NOT
      hardcode live measurement IDs in the HTML. Instead, `src/analytics/track.ts`
      → initAnalytics() injects the gtag / fbq loaders at runtime, gated on the
      VITE_GA4_ID / VITE_FB_PIXEL_ID env vars (empty OR placeholder → skipped) and
      a consent hook. When no real ID is present (dev, previews, blocked pixels)
      nothing loads and track() is a safe no-op.

      Standard GA4 install (for reference — injected by initAnalytics):
        <script async src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){ dataLayer.push(arguments); }
          gtag('js', new Date());
          gtag('config', 'GA_MEASUREMENT_ID');
        </script>

      Standard Meta Pixel install (for reference — injected by initAnalytics):
        <script>
          !function(f,b,e,v,n,t,s){ ... fbq bootstrap ... }(window, document,'script',
            'https://connect.facebook.net/en_US/fbevents.js');
          fbq('init', 'PIXEL_ID');
          fbq('track', 'PageView');
        </script>
      ────────────────────────────────────────────────────────────────────────
    -->
    <script type="module" crossorigin src="/HappyDog/assets/index-kgdRlfV6.js"></script>
  </head>
  <body>
    <!-- Phaser mounts its <canvas> into this element (see src/main.ts `parent`). -->
    <div id="game" aria-label="Happy Dog Runner game canvas"></div>
  </body>
</html>
