<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AEC6D6"/>
      <stop offset="0.5" stop-color="#CEDAE2"/>
      <stop offset="1" stop-color="#F2DDC9"/>
    </linearGradient>
  </defs>

  <!-- Soft overcast / dusk sky — gentle, light, not dark -->
  <rect width="1280" height="720" fill="url(#skyG)"/>

  <!-- Pale diffuse sun glow settling on the horizon (sympathetic warmth) -->
  <g>
    <circle cx="640" cy="498" r="210" fill="#FFE3C0" opacity="0.16"/>
    <circle cx="640" cy="498" r="132" fill="#FFE3C0" opacity="0.22"/>
    <circle cx="640" cy="498" r="74" fill="#FFEAD0" opacity="0.34"/>
  </g>

  <!-- Drifting overcast clouds (soft grey-white, kept to the sides) -->
  <g fill="#E6ECF0">
    <g opacity="0.96">
      <rect x="86" y="196" width="150" height="34" rx="17"/>
      <circle cx="122" cy="190" r="30"/>
      <circle cx="166" cy="182" r="38"/>
      <circle cx="210" cy="192" r="30"/>
    </g>
    <g opacity="0.92">
      <rect x="1040" y="150" width="162" height="36" rx="18"/>
      <circle cx="1078" cy="144" r="32"/>
      <circle cx="1126" cy="134" r="40"/>
      <circle cx="1174" cy="146" r="32"/>
    </g>
    <g opacity="0.85">
      <rect x="320" y="120" width="120" height="28" rx="14"/>
      <circle cx="348" cy="114" r="24"/>
      <circle cx="384" cy="108" r="30"/>
      <circle cx="418" cy="116" r="24"/>
    </g>
  </g>

  <!-- A couple of soft distant birds for gentle life -->
  <g fill="none" stroke="#7A8893" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M920 150 q10 -12 20 0 q10 -12 20 0"/>
    <path d="M820 184 q8 -10 16 0 q8 -10 16 0"/>
  </g>

  <!-- Muted distant hills -->
  <path d="M0 472 Q200 422 420 456 T860 452 T1280 462 L1280 520 L0 520 Z" fill="#B6D4BC"/>
  <path d="M0 502 Q260 458 540 494 T1040 490 T1280 502 L1280 540 L0 540 Z" fill="#9CC4A6"/>

  <!-- Background trees on the hill line (off-center, muted) -->
  <g fill="#8AB68E">
    <circle cx="120" cy="468" r="26"/>
    <circle cx="300" cy="476" r="19"/>
    <circle cx="982" cy="472" r="23"/>
    <circle cx="1170" cy="468" r="21"/>
  </g>

  <!-- Grass field (muted greens) -->
  <rect y="500" width="1280" height="220" fill="#5F9A55"/>
  <path d="M0 614 Q640 586 1280 614 L1280 720 L0 720 Z" fill="#4F8645"/>

  <!-- Path (muted) -->
  <path d="M596 502 C584 590 540 660 472 720 L808 720 C740 660 696 590 684 502 Z" fill="#DCC8A0"/>
  <path d="M624 506 C618 600 600 650 580 716" fill="none" stroke="#CBB187" stroke-width="6" stroke-linecap="round" opacity="0.55"/>

  <!-- Foreground framing tree, left (muted) -->
  <g>
    <rect x="141" y="404" width="18" height="108" rx="8" fill="#6E9C78"/>
    <g fill="#84B08C">
      <circle cx="150" cy="362" r="92"/>
      <circle cx="92" cy="386" r="52"/>
      <circle cx="212" cy="386" r="54"/>
      <circle cx="150" cy="300" r="58"/>
    </g>
    <g fill="#6E9C78">
      <circle cx="206" cy="402" r="40"/>
      <circle cx="150" cy="422" r="34"/>
    </g>
  </g>

  <!-- Foreground framing tree, right (muted) -->
  <g>
    <rect x="1126" y="420" width="18" height="100" rx="8" fill="#6E9C78"/>
    <g fill="#84B08C">
      <circle cx="1135" cy="380" r="86"/>
      <circle cx="1083" cy="402" r="48"/>
      <circle cx="1191" cy="402" r="50"/>
      <circle cx="1135" cy="324" r="52"/>
    </g>
    <g fill="#6E9C78">
      <circle cx="1186" cy="418" r="36"/>
      <circle cx="1135" cy="436" r="32"/>
    </g>
  </g>

  <!-- Corner bushes (muted) -->
  <g fill="#7CAE82">
    <circle cx="40" cy="676" r="34"/><circle cx="86" cy="668" r="28"/><circle cx="18" cy="692" r="24"/>
    <circle cx="1240" cy="676" r="34"/><circle cx="1194" cy="668" r="28"/><circle cx="1262" cy="692" r="24"/>
  </g>
</svg>
