<svg xmlns="http://www.w3.org/2000/svg" width="180" height="50" viewBox="0 0 180 50">
  <!-- rim / deeper water -->
  <ellipse cx="90" cy="37" rx="84" ry="12.5" fill="#6FB8DC" stroke="#2E2A28" stroke-width="2.6"/>
  <!-- surface -->
  <ellipse cx="90" cy="34" rx="77" ry="8.5" fill="#8FD3F4"/>
  <!-- surface inner glaze -->
  <ellipse cx="90" cy="33" rx="77" ry="8.5" fill="none" stroke="#6FB8DC" stroke-width="1" opacity="0.5"/>
  <!-- highlight -->
  <ellipse cx="68" cy="30" rx="22" ry="2.6" fill="#FFFFFF" opacity="0.9"/>
  <!-- reflection streak -->
  <ellipse cx="114" cy="31.5" rx="14" ry="1.8" fill="#FFFFFF" opacity="0.55"/>
  <!-- small ripples -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.6">
    <path d="M40 36 q5 -2.5 10 0"/>
    <path d="M132 37 q4 -2 8 0"/>
  </g>
</svg>
