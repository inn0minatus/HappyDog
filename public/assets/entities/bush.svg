  <!-- bush silhouette: rounded foliage clumps -->
  <path d="M 12 110 C 3 88 9 64 30 63 C 41 62 45 73 53 77 C 56 58 68 45 84 48 C 97 50 99 69 105 75 C 110 58 126 57 135 69 C 143 80 140 101 138 110 Z"
        fill="#6FBF5A" stroke="#2E2A28" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- base cel shade -->
  <g fill="#549C42">
    <ellipse cx="36" cy="100" rx="17" ry="8"/>
    <ellipse cx="78" cy="101" rx="23" ry="8"/>
    <ellipse cx="116" cy="100" rx="16" ry="7.5"/>
  </g>
  <!-- top highlights -->
