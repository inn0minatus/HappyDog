<svg xmlns="http://www.w3.org/2000/svg" width="96" height="480" viewBox="0 0 96 480">
  <defs>
    <pattern id="chk" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#FDFBF4"/>
      <rect x="16" width="16" height="16" fill="#2FB4A0"/>
      <rect y="16" width="16" height="32" fill="#2FB4A0"/>
      <rect x="16" y="16" width="16" height="16" fill="#FDFBF4"/>
    </pattern>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B6B43"/>
      <stop offset="0.4" stop-color="#E9C892"/>
      <stop offset="1" stop-color="#9B6B43"/>
    </linearGradient>
  </defs>
  <g transform="translate(-13 0)">
  <!-- pole -->
  <rect x="43" y="40" width="9" height="432" rx="4" fill="url(#wood)" stroke="#2E2A28" stroke-width="3"/>
  <!-- finial -->
  <circle cx="47.5" cy="40" r="7" fill="#2FB4A0" stroke="#2E2A28" stroke-width="3"/>
  <!-- checkered flag (faces right) -->
  <path d="M48 70 L84 66 C 92 92, 80 120, 88 146 C 95 170, 82 188, 86 196 L48 192 Z"
        fill="url(#chk)" stroke="#2E2A28" stroke-width="3" stroke-linejoin="round"/>
  <!-- flag wave shadow -->
  <path d="M48 132 C 64 126, 76 138, 86 130" fill="none" stroke="#2E2A28" stroke-width="1.4" opacity="0.25"/>
  <!-- ground peg -->
  <rect x="38" y="464" width="19" height="14" rx="3" fill="#9B6B43" stroke="#2E2A28" stroke-width="3"/>
  <ellipse cx="47.5" cy="476" rx="16" ry="3.5" fill="#2E2A28" opacity="0.18"/>
  </g>
</svg>
