  <path d="M 110,60 C 122,60 130,66 130,72 C 130,78 122,80 112,78 C 108,74 107,68 110,60 Z" fill="#FBE8C6" stroke="#2E2A28" stroke-width="3"/>

  <!-- ears (happy, up & out) -->
  <path d="M 80,50 C 72,36 74,24 82,22 C 86,34 88,46 86,54 C 84,53 82,51 80,50 Z" fill="#CC7E32" stroke="#2E2A28" stroke-width="3"/>
  <path d="M 112,46 C 118,32 128,28 134,32 C 130,44 122,52 116,55 C 114,52 113,49 112,46 Z" fill="#E08A3A" stroke="#2E2A28" stroke-width="3"/>

  <!-- collar + tag -->
  <path d="M 76,86 C 88,82 104,82 116,86" fill="none" stroke="#2FB4A0" stroke-width="8" stroke-linecap="round"/>
  <circle cx="116" cy="92" r="5" fill="#FFD24A" stroke="#2E2A28" stroke-width="2.2"/>

  <!-- face: big victory smile + tongue, happy eyes -->
  <path d="M 110,72 C 116,80 124,80 128,73" fill="none" stroke="#2E2A28" stroke-width="3" stroke-linecap="round"/>
  <path d="M 110,72 C 114,84 122,84 126,75 C 124,80 118,81 114,78 C 112,76 111,74 110,72 Z" fill="#2E2A28"/>
  <ellipse cx="118" cy="79" rx="5" ry="3.5" fill="#F27C7C" stroke="#2E2A28" stroke-width="1.4"/>
  <path d="M 120,58 C 124,60 124,64 120,65" fill="#2E2A28"/>
  <path d="M 124,58 C 128,60 128,64 124,65" fill="#2E2A28"/>
  <circle cx="122" cy="61" r="1.1" fill="#FBE8C6"/>

  <!-- celebration sparkles -->
  <path d="M 138,40 C 141,44 141,48 138,52 M 134,46 C 138,46 142,46 146,46" fill="none" stroke="#FFD24A" stroke-width="3" stroke-linecap="round"/>
</svg>
