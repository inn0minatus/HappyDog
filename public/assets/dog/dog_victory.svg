    <path d="M 40,150 C 34,140 36,128 44,122 C 40,112 34,104 40,94 C 50,92 60,98 66,108 C 78,112 96,112 112,108 C 122,112 124,124 114,128 C 108,140 100,150 88,150 Z" fill="#E09B3C"/>
  </g>

  <!-- body outline -->
  <path d="M 56,150 C 44,148 40,138 44,126 C 36,124 30,114 36,104 C 30,98 30,86 40,82 C 38,72 48,66 58,70 C 60,58 74,54 84,62 C 90,52 104,54 108,66 C 116,64 124,72 120,82 C 128,86 128,100 118,104 C 122,116 116,128 104,128 C 102,140 94,150 82,150 Z" fill="none" stroke="#2E2A28" stroke-width="3.8" stroke-linejoin="round"/>

  <!-- front paws raised up in celebration (left paw + right paw) -->
  <g fill="none" stroke-linecap="round">
    <path d="M 58,100 C 50,86 44,72 42,60" stroke="#2E2A28" stroke-width="13"/>
    <path d="M 58,100 C 50,86 44,72 42,60" stroke="#F4B860" stroke-width="9"/>
    <path d="M 104,100 C 112,86 118,72 120,60" stroke="#2E2A28" stroke-width="13"/>
    <path d="M 104,100 C 112,86 118,72 120,60" stroke="#F4B860" stroke-width="9"/>
  </g>
  <g>
    <ellipse cx="42" cy="58" rx="7" ry="5" fill="#F4B860" stroke="#2E2A28" stroke-width="2.5"/>
    <ellipse cx="120" cy="58" rx="7" ry="5" fill="#F4B860" stroke="#2E2A28" stroke-width="2.5"/>
  </g>

  <!-- head (up high, facing right) -->
  <ellipse cx="98" cy="66" rx="26" ry="23" fill="#F4B860"/>
  <path d="M 98,43 C 86,43 78,52 78,64 C 78,78 88,89 100,89 C 113,89 122,79 122,66 C 122,52 112,43 98,43 Z" fill="#E09B3C" opacity="0.55"/>
  <ellipse cx="98" cy="66" rx="26" ry="23" fill="none" stroke="#2E2A28" stroke-width="3.8"/>

