    <ellipse cx="90" cy="166" rx="7" ry="4" fill="#E09B3C" stroke="#2E2A28" stroke-width="2.5"/>
  </g>

  <!-- body fill (upright torso/chest) -->
  <path d="M 56,150 C 44,148 40,138 44,126 C 36,124 30,114 36,104 C 30,98 30,86 40,82 C 38,72 48,66 58,70 C 60,58 74,54 84,62 C 90,52 104,54 108,66 C 116,64 124,72 120,82 C 128,86 128,100 118,104 C 122,116 116,128 104,128 C 102,140 94,150 82,150 Z" fill="#F4B860"/>

  <!-- cream chest/belly -->
  <path d="M 58,150 C 52,138 52,124 58,112 C 62,100 72,96 82,100 C 86,116 86,134 82,150 Z" fill="#FBE8C6"/>

  <!-- shadow (cel, clipped) -->
