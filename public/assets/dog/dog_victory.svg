    <path d="M 56,148 C 50,156 46,162 44,166" stroke="#E09B3C" stroke-width="9"/>
    <path d="M 84,148 C 86,156 88,162 90,166" stroke="#2E2A28" stroke-width="13"/>
    <path d="M 84,148 C 86,156 88,162 90,166" stroke="#E09B3C" stroke-width="9"/>
  </g>
  <g>
