  </g>
  <g>
    <ellipse cx="24" cy="143" rx="6" ry="4" fill="#F4B860" stroke="#2E2A28" stroke-width="2.5"/>
    <ellipse cx="106" cy="82" rx="6" ry="4" fill="#F4B860" stroke="#2E2A28" stroke-width="2.5"/>
