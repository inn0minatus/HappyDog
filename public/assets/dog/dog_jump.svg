  </g>

  <!-- body outline -->
  <path d="M 38,74 C 36,60 50,55 66,57 C 77,58 81,50 88,45 C 95,40 106,41 112,47 C 116,51 120,57 125,63 C 128,66 128,70 124,72 C 119,74 113,75 107,75 C 101,75 99,79 95,82 C 91,86 89,91 86,95 C 84,101 83,107 80,112 C 66,116 49,115 39,110 C 31,105 29,99 29,91 C 29,83 32,77 38,74 Z" fill="none" stroke="#2E2A28" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- near legs (front of body): front pulled up-forward, back extended down-back (lowest contact) -->
